<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Kteam — not connected</title>
    <!-- Generated by scripts/gen-pwa.ts. Do not edit; edit the generator.
         Contains NO daemon token and NO session data: the service worker never
         caches navigations or any daemon API response, so an offline launch is
         honestly disconnected rather than a stale-looking app. This file is
         asserted to contain no API path and no external reference at all
         (scripts/build-pwa.test.ts) — it must render with zero network. -->
    <script>
      // Same contract as index.html's pre-paint bootstrap, minimised: resolve
      // the stored preference to one data-theme attribute before first paint.
      (function () {
        var FAMILIES = ['studio', 'mission', 'neo', 'ember', 'contrast', 'notebook', 'geist'];
        var MODES = ['system', 'light', 'dark'];
        var family = 'studio';
        var mode = 'system';
        try {
          var raw = localStorage.getItem('kteam-theme');
          if (raw) {
            var text = raw.trim();
            if (text.charAt(0) === '{') {
              var o = JSON.parse(text);
              if (o && FAMILIES.indexOf(o.family) >= 0) family = o.family;
              if (o && MODES.indexOf(o.mode) >= 0) mode = o.mode;
            } else if (MODES.indexOf(text) >= 0) {
              mode = text;
            } else {
              var cut = text.lastIndexOf('-');
              var f = cut > 0 ? text.slice(0, cut) : '';
              var m = cut > 0 ? text.slice(cut + 1) : '';
              if (FAMILIES.indexOf(f) >= 0 && (m === 'light' || m === 'dark')) {
                family = f;
                mode = m;
              }
            }
          }
        } catch (e) {
          /* private mode — defaults are fine */
        }
        var resolved =
          mode === 'system'
            ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.documentElement.setAttribute('data-theme', family + '-' + resolved);
      })();
    </script>
    <style>
      :root { --bg: #fbfbfc; --fg: #17171b; --accent: #4f52d6; --border: #e7e7ec; }
      [data-theme='studio-light'] { --bg: #fbfbfc; --fg: #17171b; --accent: #4f52d6; --border: #e7e7ec; }
      [data-theme='studio-dark'] { --bg: #0b0b0d; --fg: #f2f2f4; --accent: #8f93ee; --border: #2a2a30; }
      [data-theme='mission-light'] { --bg: #f1fafc; --fg: #05212a; --accent: #0a7181; --border: rgba(11, 82, 95, 0.46); }
      [data-theme='mission-dark'] { --bg: #050a0f; --fg: #effcff; --accent: #47f3ff; --border: rgba(151, 217, 224, 0.18); }
      [data-theme='neo-light'] { --bg: #f2efe6; --fg: #0a0a0a; --accent: #1f1fc4; --border: #0a0a0a; }
      [data-theme='neo-dark'] { --bg: #0e0e0c; --fg: #fdfdf4; --accent: #ffe14d; --border: #f5f5e8; }
      [data-theme='ember-light'] { --bg: #f6eee1; --fg: #2a2017; --accent: #994b18; --border: #dfcbaf; }
      [data-theme='ember-dark'] { --bg: #17120d; --fg: #f5e9d8; --accent: #f0a35a; --border: #3a2f24; }
      [data-theme='contrast-light'] { --bg: #ffffff; --fg: #000000; --accent: #0033a0; --border: #000000; }
      [data-theme='contrast-dark'] { --bg: #000000; --fg: #ffffff; --accent: #7fd4ff; --border: #ffffff; }
      [data-theme='notebook-light'] { --bg: #f1ede2; --fg: #262019; --accent: #9a4327; --border: #e0d8c6; }
      [data-theme='notebook-dark'] { --bg: #221d17; --fg: #ece3d3; --accent: #e08a67; --border: #3f362b; }
      [data-theme='geist-light'] { --bg: #fafafa; --fg: #171717; --accent: #0060df; --border: #eaeaea; }
      [data-theme='geist-dark'] { --bg: #0a0a0a; --fg: #ededed; --accent: #3b9eff; --border: #2a2a2a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 34rem; text-align: center; }
      h1 { margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 1.5rem; opacity: 0.8; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--bg);
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        /* 44px min target for coarse pointers. */
        min-height: 44px;
        padding: 0 1.25rem;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kteam is not connected</h1>
      <p>
        The <code>kteamd</code> daemon is unreachable. Kteam keeps no offline copy of
        your sessions, so there is nothing to show until it answers again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
