<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`: Android's software keyboard must
         RESIZE the layout viewport rather than pan over it, so the composer
         stays inside the shell. iOS ignores this and pans instead — that half is
         handled by sizing the shell from `window.visualViewport`
         (src/hooks/useAppViewport.ts).
         `viewport-fit=cover` lets the app paint into the notch/home-indicator
         area; index.css pays the safe-area insets back where they matter.
         NO `maximum-scale`/`user-scalable=no`: pinch-zoom must keep working
         (WCAG 1.4.4). iOS focus-zoom is prevented the correct way instead — by
         never rendering a text field below 16px on a phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- FINGERPRINTED ICONS (C3). The unfingerprinted root-level ICO fallback is
         deliberately NOT linked here: it exists only for user agents that probe
         for it on their own, it is served `immutable`, and linking it would opt
         real page loads into a potentially year-stale icon. verify-icons.ts
         fails the build if this file references that root URL at all — which is
         why this comment describes it rather than spelling it out. The `.ico`
         below is the fingerprinted copy — same bytes, cache-safe URL — listed
         after the SVG so browsers that understand SVG take that one. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.fc09cfb83e.svg" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.1e0c791b41.ico" />
    <!-- iOS ignores the web manifest for Add-to-Home-Screen and reads these
         instead. Everything here is SNAPSHOTTED AT ADD TIME and effectively
         frozen: a later release cannot change the installed icon or title.
         `black-translucent` lets the app paint under the status bar, which is
         what makes the notch area take the theme's `--bg` rather than a black
         band — index.css pays back the safe-area insets. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.1d79d00c19.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kteam" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- ONE manifest link, created here with an id, and REPOINTED IN PLACE by
         src/hooks/useTheme.ts on every theme change (audit M4) — never a second
         link element. Ten generated manifests differ only in their theme/
         background colour, so the href names the resolved family+mode. The
         release comes from the orchestrator's `VITE_KTEAM_RELEASE`; a bare
         `vite build` has no value for it and fails loudly (vite.config.ts).
         `%…%` substitution happens at build time, so the FIRST paint of a hard
         load already points at the right file — useTheme only has to keep it
         true afterwards. -->
    <link id="kteam-manifest" rel="manifest" href="/manifest-studio-light.0b819acd79ad.json" />
    <title>Kteam</title>
    <!-- Daemon substitutes the real token at serve time (loopback only). For
         non-loopback requests this stays empty and the UI shows a read-only
         banner (the daemon refuses to embed the token for remote peers). -->
    <!-- data-cfasync=false: Cloudflare Rocket Loader must NOT defer this —
         the app module reads the global at boot, and a deferred assignment
         loses the race behind the tunnel. -->
    <script data-cfasync="false">
      window.__KTEAM_TOKEN__ = '__KTEAM_TOKEN__';
    </script>
    <!-- Pre-paint theme + text-scale bootstrap. Resolves the stored preference
         to the SAME root attributes and text adjustment the app uses before first paint,
         so a hard load flashes neither the wrong theme nor the wrong type size.
         This duplicates the contract in src/hooks/useTheme.ts on purpose — that
         file cannot run this early. Keep the key, accepted values and legacy
         handling in step with it.
         data-cfasync=false for the same reason as the token above: a deferred
         run would lose the race with first paint. -->
    <script data-cfasync="false">
      (function () {
        var KEY = 'kteam-theme';
        var FAMILIES = ['studio', 'mission', 'neo', 'ember', 'contrast', 'notebook', 'geist'];
        var MODES = ['system', 'light', 'dark'];
        var TEXT_SCALES = { default: 1, large: 1.125, larger: 1.25 };
        var family = 'studio';
        var mode = 'system';
        var textScale = 'default';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var text = raw.trim();
            if (text.charAt(0) === '{') {
              var o = JSON.parse(text);
              if (o && FAMILIES.indexOf(o.family) >= 0) family = o.family;
              if (o && MODES.indexOf(o.mode) >= 0) mode = o.mode;
              if (o && Object.prototype.hasOwnProperty.call(TEXT_SCALES, o.textScale)) textScale = o.textScale;
            } else if (MODES.indexOf(text) >= 0) {
              // Legacy value: bare 'light' / 'dark' → Studio with that mode.
              mode = text;
            } else {
              var cut = text.lastIndexOf('-');
              var f = cut > 0 ? text.slice(0, cut) : '';
              var m = cut > 0 ? text.slice(cut + 1) : '';
              if (FAMILIES.indexOf(f) >= 0 && (m === 'light' || m === 'dark')) {
                family = f;
                mode = m;
              }
            }
          }
        } catch (e) {
          /* private mode / blocked storage — defaults are fine */
        }
        var resolved =
          mode === 'system'
            ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.documentElement.setAttribute('data-theme', family + '-' + resolved);
        document.documentElement.setAttribute('data-text-scale', textScale);
        document.documentElement.style.setProperty('text-size-adjust', TEXT_SCALES[textScale] * 100 + '%');
        document.documentElement.style.setProperty('-webkit-text-size-adjust', TEXT_SCALES[textScale] * 100 + '%');
        // Point the manifest link at THIS theme before first paint, using the
        // same swap rule as `manifestHrefFor()` in src/hooks/useTheme.ts (keep
        // the two in step). The build stamps a studio-light href; a reader on
        // mission-dark would otherwise expose the wrong colours to an install
        // prompt triggered before React mounts.
        try {
          var link = document.getElementById('kteam-manifest');
          if (link) {
            link.setAttribute(
              'href',
              link
                .getAttribute('href')
                .replace(/manifest-[a-z]+-[a-z]+\./, 'manifest-' + family + '-' + resolved + '.'),
            );
          }
        } catch (e) {
          /* the manifest link is best-effort; a failure here must not stop boot */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BjNHq28Q.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-4fFaiFyK.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
