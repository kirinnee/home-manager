<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`: Android's software keyboard must
         RESIZE the layout viewport rather than pan over it, so the composer
         stays inside the shell. iOS ignores this and pans instead — that half is
         handled by sizing the shell from `window.visualViewport`
         (src/hooks/useAppViewport.ts).
         `viewport-fit=cover` lets the app paint into the notch/home-indicator
         area; index.css pays the safe-area insets back where they matter.
         NO `maximum-scale`/`user-scalable=no`: pinch-zoom must keep working
         (WCAG 1.4.4). iOS focus-zoom is prevented the correct way instead — by
         never rendering a text field below 16px on a phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Kteam</title>
    <!-- Daemon substitutes the real token at serve time (loopback only). For
         non-loopback requests this stays empty and the UI shows a read-only
         banner (the daemon refuses to embed the token for remote peers). -->
    <!-- data-cfasync=false: Cloudflare Rocket Loader must NOT defer this —
         the app module reads the global at boot, and a deferred assignment
         loses the race behind the tunnel. -->
    <script data-cfasync="false">
      window.__KTEAM_TOKEN__ = '__KTEAM_TOKEN__';
    </script>
    <!-- Pre-paint theme bootstrap. Resolves the stored preference to the SAME
         single root attribute the app uses (`data-theme="<family>-<mode>"`,
         mode already resolved) before the first paint, so the page never
         flashes the wrong theme on a hard load. This duplicates the contract in
         src/hooks/useTheme.ts on purpose — that file cannot run this early.
         Keep the key, the family list and the legacy handling in step with it.
         data-cfasync=false for the same reason as the token above: a deferred
         run would lose the race with first paint. -->
    <script data-cfasync="false">
      (function () {
        var KEY = 'kteam-theme';
        var FAMILIES = ['studio', 'mission', 'neo', 'ember', 'contrast'];
        var MODES = ['system', 'light', 'dark'];
        var family = 'studio';
        var mode = 'system';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var text = raw.trim();
            if (text.charAt(0) === '{') {
              var o = JSON.parse(text);
              if (o && FAMILIES.indexOf(o.family) >= 0) family = o.family;
              if (o && MODES.indexOf(o.mode) >= 0) mode = o.mode;
            } else if (MODES.indexOf(text) >= 0) {
              // Legacy value: bare 'light' / 'dark' → Studio with that mode.
              mode = text;
            } else {
              var cut = text.lastIndexOf('-');
              var f = cut > 0 ? text.slice(0, cut) : '';
              var m = cut > 0 ? text.slice(cut + 1) : '';
              if (FAMILIES.indexOf(f) >= 0 && (m === 'light' || m === 'dark')) {
                family = f;
                mode = m;
              }
            }
          }
        } catch (e) {
          /* private mode / blocked storage — defaults are fine */
        }
        var resolved =
          mode === 'system'
            ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.documentElement.setAttribute('data-theme', family + '-' + resolved);
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DZUchJEk.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dbd_5dlF.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
